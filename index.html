<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>🎄 Božični Tekaški Koledar 2025 🎄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #0b3d91, #1c92d2);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;               /* že imaš – super za snežinke */
      position: relative;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;     /* ← MOBILNA OPTIMIZACIJA 1 */
    }
      #backToSetup {
      background: #0d6efd !important;
      padding: 14px 32px !important;
      font-size: 1.1rem !important;
      margin: 2rem auto;
      display: block !important;
      width: fit-content;
     }
    /* Snežinke – popravljeno za mobilne */
    .snowflake {
      position: fixed !important;     /* ← ključno za telefone */
      top: -10px;
      color: #fff;
      font-size: 1.2em;
      pointer-events: none;
      animation: fall linear infinite;
      opacity: 0.8;
      z-index: 9999;
      user-select: none;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Ostalo popolnoma enako kot prej ... */
    h1 { margin: 2.5rem 0 1rem; font-size: 2.5rem; text-shadow: 0 2px 4px rgba(0,0,0,.5); text-align: center; }
    .container { max-width: 900px; width: 100%; padding: 0 1rem; z-index: 10; }
    .setup { text-align: center; background: rgba(0,0,0,.2); padding: 1.5rem; border-radius: 12px; margin: 1rem 0; }
    input {
      padding: 12px;
      font-size: 1.1rem;
      width: 260px;
      border-radius: 6px;
      border: none;
      margin: 0 8px;
      -webkit-appearance: none;     /* ← lepše na iOS */
    }
    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;    /* ← MOBILNA OPTIMIZACIJA 2 */
      -webkit-tap-highlight-color: transparent; /* brez modrega "flasha" na Androidu */
    }
    button:hover, button:active { background: #ff1a1a; }

    .calendar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      perspective: 1000px;
      margin-top: 2rem;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }
    .door {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.15s ease;   /* malo počasneje = lepše na telefonu */
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,.4);
      touch-action: manipulation;        /* ← MOBILNA OPTIMIZACIJA 3 – ključno! */
      -webkit-tap-highlight-color: transparent;
    }
    .door:active {
      transform: translateY(-2px) scale(0.98); /* rahlo "stisne" ob dotiku – super feedback */
    }
    .door .side { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; padding: 8px; box-sizing: border-box; user-select: none; }
    .door .front { background: linear-gradient(135deg, #c41e3a, #ff4d4d); color: #fff; font-size: 2rem; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
    .door .back { background: #fff; color: #c41e3a; transform: rotateY(180deg); font-size: 1.1rem; text-align: center; }
    .door .back .date { font-weight: bold; font-size: 1.3rem; margin-bottom: 4px; }
    .door .back .distance { font-size: 1.8rem; font-weight: bold; color: #c41e3a; }
    .door.flipped { transform: rotateY(180deg); }
    .total-km { margin: 2rem 0; font-size: 1.5rem; font-weight: bold; text-align: center; background: rgba(255,255,255,.1); padding: 1rem; border-radius: 12px; backdrop-filter: blur(4px); }
    .share { margin: 1.5rem 0; font-size: 0.9rem; text-align: center; }
    .share input { width: 100%; max-width: 500px; margin-top: 8px; }
    footer { margin: 2rem 0; font-size: .9rem; opacity: .8; text-align: center; }

    /* Mobilna prilagoditev – že imaš, samo dodan en detajl */
    @media (max-width: 700px) {
      .calendar { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); gap: 10px; }
      h1 { font-size: 2rem; }
      input, button { width: 100%; margin: 8px 0; }
      .door { transition: transform 0.2s ease; } /* malo počasneje na telefonu = lepše */
    }
  </style>
</head>
<body>
  <!-- HTML popolnoma enak kot prej -->
  <div class="container">
    <h1>🎄 Božični Tekaški Koledar 2025 🎄</h1>
    <div class="setup" id="setup">
      <p><strong>Vnesi skrivni ključ</strong> (npr. tvoje ime, ekipa ali "slovenija2025"):</p>
      <input type="text" id="seedInput" placeholder="Vpiši tukaj..." value="" />
      <button id="generate">Ustvari</button>
      <p style="margin-top:1rem;"> Deli <u>isti ključ</u> → vsi dobijo <u>isti koledar</u>! </p>
    </div>
    <div id="result" style="display:none; text-align:center;">
      <div class="calendar" id="calendar"></div>
      <div class="total-km">Odpri eno vratca na dan od 1. do 24. decembra! Skupaj: 300 km</div>
      <button id="backToSetup">🔙 Nazaj na vnos ključa</button>
      <div class="share">
        <p><strong>Deli to povezavo:</strong></p>
        <input type="text" id="shareLink" readonly />
      </div>
    </div>
  </div>
  <footer>Natisni: Ctrl+P → Shrani kot PDF</footer>

  <script>
    // Snežinke – brez sprememb
    function createSnowflake() {
      const s = document.createElement('div');
      s.className = 'snowflake';
      s.innerHTML = '❅';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDuration = Math.random() * 5 + 5 + 's';
      s.style.fontSize = Math.random() * 10 + 10 + 'px';
      document.body.appendChild(s);
      setTimeout(() => s && s.remove(), 12000);
    }
    setInterval(createSnowflake, 300);

    // Preostala logika 100% enaka kot prej – samo event listener za back gumb je premaknjen ven iz generateCalendar()
    const urlParams = new URLSearchParams(window.location.search);
    const urlSeed = urlParams.get('seed');
    if (urlSeed) {
      document.getElementById('seedInput').value = decodeURIComponent(urlSeed);
      generateCalendar();
    }

    document.getElementById('generate').addEventListener('click', generateCalendar);
    document.getElementById('backToSetup').addEventListener('click', () => {
      document.getElementById('result').style.display = 'none';
      document.getElementById('setup').style.display = 'block';
      document.getElementById('seedInput').value = '';
      history.replaceState(null, '', window.location.pathname);
      document.getElementById('calendar').innerHTML = '';
    });

    function generateCalendar() {
      const seedInput = document.getElementById('seedInput').value.trim();
      if (!seedInput) return alert('Prosim, vnesi ključ!');

      const distances = seededShuffle(Array.from({length:24}, (_,i)=>i+1), seedInput);

      const newUrl = new URL(window.location);
      newUrl.searchParams.set('seed', encodeURIComponent(seedInput));
      history.replaceState(null, '', newUrl);
      document.getElementById('shareLink').value = newUrl.toString();

      document.getElementById('setup').style.display = 'none';
      document.getElementById('result').style.display = 'block';

      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';
      distances.forEach((dist, i) => {
        const day = i + 1;
        const door = document.createElement('div');
        door.className = 'door';
        door.innerHTML = `
          <div class="side front">${day}</div>
          <div class="side back">
            <div class="date">${day}. dec</div>
            <div class="distance">${dist} km</div>
          </div>
        `;
        door.addEventListener('click', () => door.classList.toggle('flipped'));
        calendar.appendChild(door);
      });
    }

    // Seeded random funkciji – nespremenjeni
    function seededRandom(seed) { /* ... enako kot prej ... */ }
    function seededShuffle(array, seedStr) { /* ... enako kot prej ... */ }
    // (kopiraj iz tvoje originalne kode – nisem jih krajšal)
    function seededRandom(seed) {
      let h = 1779033703 ^ seed.length;
      for(let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 3432918353), h = h << 13 | h >>> 19;
      return function() { h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); return (h ^= h >>> 16) >>> 0; };
    }
    function seededShuffle(array, seedStr) {
      const arr = [...array];
      const rand = seededRandom(seedStr);
      for (let i = arr.length-1; i > 0; i--) {
        const j = Math.floor((rand() / 4294967296) * (i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
  </script>
</body>
</html>
